<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#040e2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Beat Me in 3">
  <meta name="description" content="Guess the secret number in 3 tries. Daily challenges, friend duels, global leaderboard.">

  <!-- Open Graph -->
  <meta property="og:title" content="Beat Me in 3">
  <meta property="og:description" content="Guess the secret number in 3 tries. Can you beat your friends?">
  <meta property="og:image" content="https://oddpebblegames.github.io/beat-me-in-3/icon-512.png">
  <meta property="og:url" content="https://oddpebblegames.github.io/beat-me-in-3/">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Beat Me in 3">
  <meta name="twitter:description" content="Guess the secret number. 3 tries. 15 seconds. Daily challenge.">

  <link rel="manifest" href="/beat-me-in-3/manifest.json">
  <link rel="apple-touch-icon" href="/beat-me-in-3/icon-192.png">

  <!-- Preconnect for font performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- font-display=swap prevents render-blocking; subset only needed weights -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

  <!-- Preconnect to Firebase (loaded after interaction) -->
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">

  <title>Beat Me in 3</title>

  <!-- Critical CSS inlined for fastest FCP -->
  <style>
    :root {
      --color-bg-primary: #040e2e;
      --color-brand-500: #2655cc;
      --color-white: #ffffff;
      --font-body: system-ui, sans-serif;
    }
    html { height: 100%; }
    body {
      margin: 0;
      background: var(--color-bg-primary);
      color: var(--color-white);
      font-family: var(--font-body);
      min-height: 100dvh;
    }
    #app { width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .skip-link { position: absolute; top: -100%; }
  </style>
</head>
<body>

  <!-- Skip to main content (keyboard accessibility) -->
  <a href="#app" class="skip-link">Skip to game</a>

  <!-- Ambient background -->
  <div class="bg-stars" aria-hidden="true">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
  </div>

  <!-- App root — screens are injected here by screen modules -->
  <div id="app" role="main">

    <!-- ── HOME SCREEN ────────────────────────────────────── -->
    <section id="screen-home" class="screen active" aria-label="Home">
    </section>

    <!-- ── GAME SCREEN ───────────────────────────────────── -->
    <section id="screen-game" class="screen" aria-label="Game">
    </section>

    <!-- ── WIN / LOSE SCREEN ─────────────────────────────── -->
    <section id="screen-result" class="screen" aria-label="Result">
    </section>

    <!-- ── LEADERBOARD SCREEN ────────────────────────────── -->
    <section id="screen-leaderboard" class="screen" aria-label="Leaderboard">
    </section>

    <!-- ── STATS SCREEN ──────────────────────────────────── -->
    <section id="screen-stats" class="screen" aria-label="Statistics">
    </section>

    <!-- ── SETTINGS SCREEN ───────────────────────────────── -->
    <section id="screen-settings" class="screen" aria-label="Settings">
    </section>

    <!-- ── ONBOARDING SCREEN ─────────────────────────────── -->
    <section id="screen-onboarding" class="screen" aria-label="Tutorial">
    </section>

  </div>

  <!-- Global toast notification -->
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Confetti layer (positioned by JS) -->
  <div id="confetti-layer" aria-hidden="true"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
